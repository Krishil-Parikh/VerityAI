[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rti-ethics-engine"
version = "1.0.0"
description = "India's first granular AI ethics framework for RTI applications (36 metrics, 9 dimensions)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "RTI Ethics Engine Team"}
]
keywords = [
    "ai-ethics",
    "rti",
    "india",
    "government",
    "compliance",
    "fairness",
    "audit",
    "llm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0"
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0"
]

[project.urls]
Homepage = "https://github.com/rti-ethics/rti-ethics-engine"
Documentation = "https://rti-ethics-engine.readthedocs.io"
Repository = "https://github.com/rti-ethics/rti-ethics-engine"
Issues = "https://github.com/rti-ethics/rti-ethics-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["rti_ethics_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "/rti_ethics_engine",
    "/tests",
    "/README.md",
    "/LICENSE"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
